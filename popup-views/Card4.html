<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بطاقة - Beeboard</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="../css/CardS.css">






</head>

<body>
  <div class="overlay">
    <div class="card-modal">
      <div class="top-section">
        <div class="sidebar-buttons">
          <button class="member-btn"><i class="fas fa-users"></i> الأعضاء</button>
          <button class="tag-btn"><i class="fas fa-tag"></i> الوسوم</button>
        </div>
        <div class="input-group">
          <label><i class="fas fa-id-card"></i> اسم البطاقة</label>
          <input type="text" placeholder="عرض يفهم جوك" />
        </div>
      </div>

      <div class="description-section">
        <label><i class="fas fa-align-right"></i> الوصف</label>
        <div id="editor-container"></div>
      </div>

      <div class="comment-section">
        <label><i class="fas fa-comment"></i> تعليق</label>
        <input type="text" placeholder="تسليم نهاية الأسبوع" />
        <div class="comment-footer">
          <img src="https://i.imgur.com/0y0y0y0.png" alt="صورة العضو" />
          <span> توضع في جميع مواقع التواصل الاجتماعي</span>
        </div>
      </div>

      <div class="actions">
        <button class="cancel-btn">إلغاء</button>
        <button class="add-btn">إضافة بطاقة</button>
      </div>
    </div>
  </div>

  <!-- مكتبة Quill JS -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <!-- ملف JS-->
    <script src="../js/CreateCard.js"></script>
  <script src="../js/CardP.js"></script>


</body>

</html>
