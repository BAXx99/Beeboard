<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Modal Design2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #eee;
      margin: 0;
      padding: 0;
    }

    .modal {
      width: 600px;
      max-width: 95%;
      margin: 100px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      padding: 30px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 22px;
      color: #444;
      background: none;
      border: none;
      cursor: pointer;
    }

    .modal h2 {
      margin: 0;
      font-size: 22px;
    }

    .description {
      color: #777;
      margin-top: 10px;
    }

    .circle-icon {
      width: 60px;
      height: 60px;
      background-color: #1abc9c;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      margin: 30px auto;
    }

    .section-title {
      margin-top: 30px;
      font-weight: bold;
    }

    .member-box {
      background-color: #f8f9fa;
      padding: 15px 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-top: 15px;
      direction: rtl;
    }

    .avatar {
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .member-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background-color: #f4d03f;
      color: #000;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: flex-start; /* المهم: تخلي الأزرار يمين */
      gap: 10px;
      margin-top: 30px;
    }

    .btn {
      width: fit-content;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .btn.edit {
      background-color: #2196F3;
    }

    .btn.leave {
      background-color: #e74c3c;
    }
  </style>
</head>
<body>

  <div class="modal">
    <button class="close-btn">&times;</button>
    <h2>Test Project</h2>
    <div class="description">لا يوجد وصف</div>

    <div class="circle-icon">TP</div>

    <div class="section-title">الأعضاء</div>
    <div class="member-box">
      <div class="avatar">H</div>
      <div class="member-name">
        <span>hassan (عضو)</span>
        <span class="badge">مالك</span>
      </div>
    </div>

    <div class="buttons">
      
      <button class="btn leave">مغادرة المشروع</button>
    </div>
  </div>

</body>
</html>
